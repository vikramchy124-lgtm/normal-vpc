name: Deploy project to S3

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  S3_BUCKET: terra-project-unique-bucket-20260901-us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Set Terraform variables
        run: echo "TF_VAR_ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}" >> "$GITHUB_ENV"
      - name: Check required Terraform secret
        run: test -n "$TF_VAR_ssh_public_key"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize Terraform
        run: terraform init

      - name: Apply infrastructure
        run: terraform apply -auto-approve -input=false

      - name: Upload project files to S3
        run: >-
          aws s3 sync . s3://${{ env.S3_BUCKET }}
          --delete
          --exclude ".git/*"
          --exclude ".github/*"
          --exclude "*.tfstate"
          --exclude "*.tfstate.*"
          --exclude ".terraform/*"
